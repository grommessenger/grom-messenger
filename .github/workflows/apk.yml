name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Получение исходного кода
        uses: actions/checkout@v4

      - name: Установка Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Установка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Сборка приложения
        run: |
          mkdir www
          cp -r * www/ 2>/dev/null || true
          rm -rf www/www
          npm init -y
          npm install @capacitor/core @capacitor/android
          npm install @capacitor/cli --save-dev
          
          npx cap init "Гром" "com.grom.messenger" --web-dir "www"
          npx cap add android
          
          npm install @capacitor/assets --save-dev
          npx capacitor-assets generate --iconPath IMG_20261023_101101_756.jpg --android
          
          cd android
          
          cat <<EOF >> build.gradle
          allprojects {
              configurations.all {
                  resolutionStrategy {
                      force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.22'
                  }
              }
          }
          EOF
          
          ./gradlew assembleDebug

      - name: Выгрузка готового APK
        uses: actions/upload-artifact@v4
        with:
          name: Grom-Messenger-Beta
          path: android/app/build/outputs/apk/debug/*.apk
